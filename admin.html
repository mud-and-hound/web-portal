<!doctype html>
<html lang="th">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>จัดการลิงก์ · Mud & Hound Web Portal</title>
<link rel="stylesheet" href="./style.css">
<script type="module" src="./app.js"></script>
<header><a class="brand" href="./">Mud &amp; Hound <span>Web Portal</span></a><a href="./">← หน้าแรก</a></header>
<main>
  <h1>จัดการลิงก์</h1>
  <p id="status" role="status"></p>
  <form id="login" class="panel">
    <label>อีเมล<input type="email" name="email" autocomplete="username" required></label>
    <label>รหัสผ่าน<input type="password" name="password" autocomplete="current-password" required></label>
    <div class="actions"><button>เข้าสู่ระบบ</button><button type="button" id="reset" class="secondary">ตั้งรหัสผ่านใหม่</button><button type="button" id="signup" class="secondary">เปิดบัญชีครั้งแรก</button></div>
  </form>
  <form id="password" class="panel" hidden>
    <label>ตั้งรหัสผ่านใหม่<input type="password" name="password" autocomplete="new-password" minlength="12" required></label>
    <button>บันทึกรหัสผ่าน</button>
  </form>
  <section id="workspace" hidden>
    <div class="toolbar"><h2>ลิงก์ระบบงาน</h2><button id="logout" class="secondary">ออกจากระบบ</button></div>
    <form id="editor" class="panel">
      <h3 id="editor-title">เพิ่มลิงก์</h3>
      <div class="fields">
        <label>ชื่อระบบ<input name="title" maxlength="100" required></label>
        <label>URL<input name="url" type="url" placeholder="https://example.com" maxlength="2000" required></label>
      </div>
      <label>คำอธิบาย<input name="description" maxlength="240"></label>
      <div class="actions"><button>บันทึก</button><button id="cancel-edit" type="button" class="secondary" hidden>ยกเลิกแก้ไข</button></div>
    </form>
    <div id="links" class="admin-links"></div>
  </section>
</main>
</html>
